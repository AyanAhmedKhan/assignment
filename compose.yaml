services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-employees}
      POSTGRES_USER: ${DB_USERNAME:-employee_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-employee_local_dev}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - employee_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-employees}
      DB_USERNAME: ${DB_USERNAME:-employee_app}
      DB_PASSWORD: ${DB_PASSWORD:-employee_local_dev}
      PGHOST: db
      PGDATABASE: ${DB_NAME:-employees}
      PGUSER: ${DB_USERNAME:-employee_app}
      PGPASSWORD: ${DB_PASSWORD:-employee_local_dev}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-2026}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: 'false'
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-cloud,demo}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    restart: unless-stopped
volumes:
  employee_data:

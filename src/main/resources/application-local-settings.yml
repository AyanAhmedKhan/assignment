# Loaded last by the local profile group; these defaults are only for loopback development.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employees}
    username: ${DB_USERNAME:employee_app}
    password: ${DB_PASSWORD:employee_local_dev}
server:
  address: 127.0.0.1
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        secure: false
app:
  admin:
    password: ${ADMIN_PASSWORD:local-admin-password-2026}

spring:
  application:
    name: kloudspot-assignment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employees}
    username: ${DB_USERNAME:employee_app}
    password: ${DB_PASSWORD:employee_local_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:${APP_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
